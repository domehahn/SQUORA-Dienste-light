<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dienstplan für Heimturniere und Trikotwäsche – fair verteilt unter den Eltern." />
    <title>Dienste – Turnier-Dienstplan</title>
    <script>
      // Theme vor dem ersten Paint setzen, um ein kurzes Aufblitzen des
      // falschen Farbschemas zu vermeiden (siehe src/lib/theme.ts).
      (function () {
        try {
          var stored = localStorage.getItem("dienste_theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
