# Web-Worker für die Dienste-SPA (statische Assets + SPA-Fallback + API-
# Weiterleitung per Service Binding). Getrennt vom API-Worker in
# worker/wrangler.toml.
name = "dienste-web"
main = "cloudflare/web-router.ts"
compatibility_date = "2026-07-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[services]]
binding = "API"
service = "dienste-api"

[observability]
enabled = true
